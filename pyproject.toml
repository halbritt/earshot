[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earshot-coach"
version = "0.1.0"
description = "Live Conversation Coach for earshot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28.1",
  "numpy>=2.4.0",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.8.0",
  "websockets>=16.0",
]

[project.scripts]
coach = "coach.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.150.0",
  "mypy>=1.19.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15.0",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
