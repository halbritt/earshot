[tasks.test]
description = "Bench tests (scoring, variant runner, command line)"
run = '''sh -eu -c '
# host:exec is an optional private wrapper task (resource-limited runner). Use it when this
# machine defines it; every other clone runs pytest directly.
[ "$#" -gt 0 ] || set -- tests
if mise tasks info host:exec >/dev/null 2>&1; then
  exec mise run host:exec --timeout 5m --weight 1 -- python3 -B -m pytest -q -p no:cacheprovider "$@"
fi
exec python3 -B -m pytest -q -p no:cacheprovider "$@"
' sh'''
